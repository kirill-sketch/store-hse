version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка - один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка - статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: [ 'paid', 'pending', 'returned', 'cancelled' ]
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [ non_negative ]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
      - name: items_count
        description: "Количество разных товаров в заказе."

  - name: fct_order_items
    description: "Позиции заказов без тестовых заказов. Одна строка значит один товар в заказе."
    columns:
      - name: order_item_id
        description: "Уникальный ключ позиции заказа."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Заказ, которому принадлежит позиция."
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар в позиции."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: quantity
        description: "Количество единиц товара в позиции."
      - name: unit_price
        description: "Цена одной единицы товара."
      - name: discount_amount
        description: "Скидка на всю позицию."
      - name: line_amount
        description: "Сумма позиции после скидки."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'

  - name: dim_customers
    description: "Клиенты, включая тех, кто ещё не совершил покупку."
    columns:
      - name: customer_id
        description: "Уникальный номер клиента."
        data_tests: [ unique, not_null ]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации без времени."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки; пусто, если покупок нет."
      - name: first_confirmed_at
        description: "Время оформления первой подтверждённой покупки; пусто, если покупок нет."
      - name: confirmed_orders_count
        description: "Количество подтверждённых покупок клиента."
      - name: confirmed_revenue
        description: "Общая сумма подтверждённых покупок клиента."
      - name: is_buyer
        description: "Есть ли у клиента хотя бы одна подтверждённая покупка."

  - name: dim_products
    description: "Товары с брендом и иерархией категорий."
    columns:
      - name: product_id
        description: "Уникальный номер товара."
        data_tests: [ unique, not_null ]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Непосредственная категория товара."
      - name: parent_category_name
        description: "Родительская категория; пусто для верхнего уровня."
      - name: root_category_name
        description: "Категория верхнего уровня: Electronics или Home."

  - name: dim_dates
    description: "Календарь дат заказов."
    columns:
      - name: order_date
        description: "Календарный день."
        data_tests: [ unique, not_null ]
      - name: year
        description: "Год."
      - name: quarter
        description: "Квартал года от 1 до 4."
      - name: month
        description: "Номер месяца от 1 до 12."
      - name: day_of_month
        description: "Номер дня месяца."
      - name: day_of_week
        description: "Номер дня недели: понедельник - 1, воскресенье - 7."
      - name: is_weekend
        description: "Признак субботы или воскресенья."